<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style><title>Rumbo Barcelona</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Family guide to Barcelona: where to go, how to get there, where to eat, run, ride and watch Barça.">
<meta name="author" content="Dr. Cary Marlowe T. Remotigue (founder)">
<meta name="copyright" content="© 2026 Cary Marlowe T. Remotigue. All rights reserved.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#141619">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rumbo">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-column phone app — black taxi-roof header, "where to" search, card lists, fixed bottom tab bar. */
:root{
  --bg:#EEF1F3; --surface:#FFFFFF; --surface-2:#F6F7F8; --ink:#121417; --muted:#59626D; --line:#D9DEE3;
  --taxi:#F7C51E; --taxi-ink:#141414; --roof:#141619; --roof-ink:#F4F5F6; --cobalt:#2546B8;
  --open:#1B7F45; --closed:#B4372D; --warn-bg:#FFF3CC; --warn-ink:#5C4500; --info-bg:#E6ECFB; --info-ink:#1D3480;
  --shadow:0 1px 2px rgba(18,20,23,.06),0 6px 18px rgba(18,20,23,.06);
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif; --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:14px; --nav-h:64px;
  --c-tomato:#E2442F; --c-saffron:#E39A0B; --c-cobalt:#2952D1; --c-teal:#0E9C88; --c-violet:#6B4FD8; --c-green:#2E9B4F; --c-coffee:#8A5A35; --c-magenta:#C13584; --c-grana:#A50044; --c-blau:#004D98;
  --accent:var(--ink);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D0F12; --surface:#171A1F; --surface-2:#1E2228; --ink:#EEF1F4; --muted:#A1AAB5; --line:#2C323A;
  --taxi:#FFCF2E; --taxi-ink:#141414; --roof:#08090B; --roof-ink:#F4F5F6; --cobalt:#8FA6FF;
  --open:#4CC07D; --closed:#FF8173; --warn-bg:#3A2E06; --warn-ink:#FFE08A; --info-bg:#1A2448; --info-ink:#C5D2FF;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0D0F12; --surface:#171A1F; --surface-2:#1E2228; --ink:#EEF1F4; --muted:#A1AAB5; --line:#2C323A;
  --taxi:#FFCF2E; --taxi-ink:#141414; --roof:#08090B; --roof-ink:#F4F5F6; --cobalt:#8FA6FF;
  --open:#4CC07D; --closed:#FF8173; --warn-bg:#3A2E06; --warn-ink:#FFE08A; --info-bg:#1A2448; --info-ink:#C5D2FF;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--roof)}
a{color:var(--cobalt)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px;border-radius:6px}
.wrap{max-width:620px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Header: taxi roof */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--roof);color:var(--roof-ink)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:34px;height:34px;border-radius:9px;background:var(--taxi);display:grid;place-items:center;flex:none}
.brand b{font-family:var(--f-display);font-stretch:125%;font-weight:900;font-size:19px;letter-spacing:.02em;line-height:1}
.brand small{display:block;font-family:var(--f-mono);font-size:11px;opacity:.75;letter-spacing:.04em;margin-top:3px;white-space:nowrap}
.from{margin-left:auto;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:7px 12px;font-size:13px;max-width:52%;cursor:pointer}
.from span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Appearance switch (Auto / Dark / Light), remembered per phone */
.top .brand{flex:none}
.top .from{min-width:0}
.thm{flex:none;width:36px;height:36px;padding:0;display:grid;place-items:center;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:var(--roof-ink);cursor:pointer}
.thm svg{width:18px;height:18px;display:block}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;font-weight:600;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center;white-space:nowrap}
:root[data-theme="light"]{color-scheme:light}
/* Ask results + cravings */
#live{display:grid;gap:12px;scroll-margin-top:calc(env(safe-area-inset-top,0px) + 76px)}
#live:empty,#thread:empty{display:none}
.crave{gap:10px}
.crave h3{margin-top:2px}
.crave .loc{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.02em;color:var(--muted);margin-top:4px}
.crave .what{font-size:14px}
.crave .tip{font-size:13px;color:var(--muted)}
.season{display:inline-block;font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;border-radius:5px;padding:2px 6px;margin-left:8px;vertical-align:3px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.season.now{background:var(--taxi);color:var(--taxi-ink);border-color:transparent}

main{padding-bottom:calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px))}
.credit{margin:28px 0 0;padding-top:14px;border-top:1px solid var(--line, rgba(128,128,128,.25));text-align:center;font-size:12px;line-height:1.55;opacity:.75}
.credit b{font-weight:700;color:var(--ink)}
section[data-tab]{padding-block:16px 8px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
h1{font-stretch:112%;font-weight:850;font-size:clamp(26px,7vw,34px);line-height:1.02;letter-spacing:-.01em}
h2{font-stretch:110%;font-weight:800;font-size:19px;line-height:1.15}
h3{font-stretch:100%;font-weight:750;font-size:17px;line-height:1.2}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
p{margin:0}

/* Search */
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:6px 6px 6px 14px;box-shadow:var(--shadow)}
.search:focus-within{border-color:var(--ink)}
.search input{flex:1;min-width:0;border:0;background:transparent;font-size:17px;padding:10px 0;outline:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:12px;padding:10px 14px;font-weight:650;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn.taxi{background:var(--taxi);color:var(--taxi-ink)}
.btn.ink{background:var(--ink);color:var(--bg)}
.btn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:default}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13px;cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Segmented control */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px 4px;font-weight:600;font-size:14px;cursor:pointer;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* Cards */
.list{display:grid;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:9px;min-width:0}
.card .head{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.card .head > div{min-width:0}
.since{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13px;color:var(--muted)}
.lines{display:inline-flex;gap:3px;vertical-align:middle}
.ln{font-family:var(--f-mono);font-weight:500;font-size:11px;line-height:1;padding:4px 5px;border-radius:5px;color:#fff;letter-spacing:.02em}
.ln.dark{color:#141414}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill.open{color:var(--open)}.pill.open::before{background:var(--open)}
.pill.closed{color:var(--closed)}.pill.closed::before{background:var(--closed)}
.pill.unknown{color:var(--muted)}
.tag{font-size:11.5px;font-weight:600;border-radius:6px;padding:3px 7px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.order{font-size:14px}
.order b{font-weight:650}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.rec{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:650;background:var(--surface-2);border-radius:8px;padding:5px 9px;border:1px solid var(--line)}
.rec i{font-style:normal;font-family:var(--f-mono);font-weight:500;color:var(--muted)}

/* Notices */
.note{border-radius:12px;padding:11px 13px;font-size:14px;display:grid;gap:3px}
.note.warn{background:var(--warn-bg);color:var(--warn-ink)}
.note.info{background:var(--info-bg);color:var(--info-ink)}
.note b{font-weight:700}
.note a{color:inherit}

/* Today strip */
.today{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.stat .k{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-family:var(--f-display);font-weight:800;font-stretch:105%;font-size:16px;line-height:1.15;margin-top:3px;font-variant-numeric:tabular-nums}
.stat .s{font-size:12px;color:var(--muted);margin-top:2px}

/* Results */
.results{display:grid;grid-template-columns:minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;cursor:pointer;width:100%}
.row:first-child{border-top:0}
.row .ic{width:34px;height:34px;border-radius:10px;background:var(--c-cobalt);display:grid;place-items:center;flex:none}
.row .t{min-width:0;flex:1}
a.row{color:var(--ink);text-decoration:none}
.hrs{border-top:1px solid var(--line);padding-top:8px}
.hrs summary{display:flex;align-items:center;gap:8px;cursor:pointer;list-style:none;font-size:13.5px;font-weight:600;color:var(--ink)}
.hrs summary::-webkit-details-marker{display:none}
.hrs summary .more{margin-left:auto;font-size:12px;font-weight:700;color:var(--accent,var(--c-cobalt));white-space:nowrap}
.hrs[open] summary .more{opacity:.6}
.hrs svg,.hrs-line svg{width:16px;height:16px;flex:none;color:var(--muted)}
.hrs ul{list-style:none;margin:8px 0 6px;padding:0;display:grid;gap:1px;font-size:13px}
.hrs li{display:flex;justify-content:space-between;gap:12px;padding:4px 8px;border-radius:8px}
.hrs li span{color:var(--muted)}
.hrs li b{font-weight:600;text-align:right;color:var(--ink)}
.hrs li.today{background:var(--surface-2)}
.hrs li.today span{color:var(--ink);font-weight:700}
.hrs p{margin:4px 0 0}
.hrs-line{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;margin:0;color:var(--ink)}
#tab-more .seg{grid-auto-columns:auto}
.sos{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1.5px solid var(--c-tomato);border-radius:16px;padding:10px 12px;background:var(--surface)}
.sos-call{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);flex:1;min-width:0}
.sos-call svg{width:28px;height:28px;color:var(--c-tomato);flex:none}
.sos-call b{display:block;font-family:var(--f-display);font-weight:900;font-size:24px;line-height:1;color:var(--c-tomato)}
.sos-call small{display:block;font-size:12px;color:var(--muted)}
.sos-card{border-color:var(--c-tomato)}
.nums{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:10px}
.nums li{display:grid;grid-template-columns:128px minmax(0,1fr);gap:12px;align-items:start}
.nums li>a{display:flex;justify-content:center;white-space:nowrap;padding:8px 10px;border-radius:12px;background:var(--c-tomato);color:#fff;text-decoration:none;font-family:var(--f-mono);font-size:15px}
.nums li>a b{font-weight:700}
.nums li span b{display:block;font-size:14px}
.nums li span small{display:block;font-size:12.5px;color:var(--muted);line-height:1.4}
ol.steps{margin:6px 0 8px;padding-left:20px;display:grid;gap:6px}
.needs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:560px){.needs{grid-template-columns:repeat(4,minmax(0,1fr))}}
.need{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);text-decoration:none;min-width:0}
.need svg{width:22px;height:22px;flex:none;color:var(--c-green)}
.need span{min-width:0}
.need b{display:block;font-weight:700;font-size:14px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.need small{display:block;font-size:11.5px;color:var(--muted)}
.row .t b{display:block;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .d{font-family:var(--f-mono);font-size:12px;color:var(--muted);flex:none;font-variant-numeric:tabular-nums}

/* Chat */
.thread{display:grid;gap:10px}
.msg{max-width:92%;border-radius:14px;padding:10px 13px;white-space:pre-wrap;word-wrap:break-word;font-size:15px}
.msg.me{justify-self:end;background:var(--ink);color:var(--bg);border-bottom-right-radius:4px}
.msg.ai{justify-self:start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.ai.thinking{color:var(--muted)}
.askbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* Ride options */
.rides{display:grid;gap:8px}
.ride{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);text-decoration:none;color:var(--ink)}
.ride.best{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.ride .ri{width:40px;height:40px;border-radius:10px;background:var(--c-cobalt);display:grid;place-items:center}
.ride b{display:block;font-weight:700}
.ride span{display:block;font-size:12.5px;color:var(--muted)}
.ride .p{text-align:right;font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums}
.ride .p em{display:block;font-style:normal;font-size:11px;color:var(--muted)}
.badge{display:inline-block;font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;background:var(--taxi);color:var(--taxi-ink);border-radius:5px;padding:2px 5px;margin-left:6px;vertical-align:2px}

/* Tables */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl td,.tbl th{padding:8px 4px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
.tbl td.n{font-family:var(--f-mono);white-space:nowrap;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}

/* Fixtures */
.fx{display:grid;grid-template-columns:62px minmax(0,1fr);gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.fx:first-child{border-top:0}
.fx .dt{font-family:var(--f-mono);font-size:12px;line-height:1.25;color:var(--muted);font-variant-numeric:tabular-nums}
.fx .dt b{display:block;font-family:var(--f-display);font-size:17px;color:var(--ink);font-weight:800}
.fx .m{font-weight:650}
.fx.home .m::after{content:"Camp Nou";margin-left:8px;font-size:10.5px;font-family:var(--f-mono);letter-spacing:.05em;text-transform:uppercase;background:var(--taxi);color:var(--taxi-ink);padding:2px 5px;border-radius:5px;vertical-align:2px}
.hero-fx{background:var(--roof);color:var(--roof-ink);border-radius:var(--r);padding:16px;display:grid;gap:6px;border-bottom:4px solid var(--taxi)}
.hero-fx .vs{font-family:var(--f-display);font-stretch:118%;font-weight:900;font-size:clamp(22px,6.4vw,30px);line-height:1.02}
.hero-fx .when{font-family:var(--f-mono);font-size:13px;opacity:.85}

/* Colour system: each section owns a hue */
section[data-tab="ask"]{--accent:var(--c-violet)} section[data-tab="go"]{--accent:var(--c-saffron)} section[data-tab="eat"]{--accent:var(--c-tomato)}
section[data-tab="see"]{--accent:var(--c-cobalt)} section[data-tab="active"]{--accent:var(--c-green)} section[data-tab="more"]{--accent:var(--c-violet)}
section[data-tab] .eyebrow:first-child{color:var(--accent);font-weight:500}
section[data-tab] .seg button[aria-selected="true"]{background:var(--accent);color:#fff;box-shadow:none}
.i{width:20px;height:20px;flex:none}
.ict{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#fff;flex:none}
.ict svg{width:21px;height:21px}
.ict.taxi{color:#141414}
.card .head .ttl{display:flex;gap:11px;align-items:center;min-width:0}
.bg-tomato{background:var(--c-tomato)}.bg-saffron{background:var(--c-saffron)}.bg-cobalt{background:var(--c-cobalt)}.bg-teal{background:var(--c-teal)}.bg-violet{background:var(--c-violet)}.bg-green{background:var(--c-green)}.bg-coffee{background:var(--c-coffee)}.bg-magenta{background:var(--c-magenta)}.bg-taxi{background:var(--taxi)}.bg-ink{background:#2A2F36}.bg-barca{background:linear-gradient(135deg,var(--c-blau) 0 50%,var(--c-grana) 50% 100%)}
.hero{position:relative;overflow:hidden;background:var(--roof);color:#fff;border-radius:20px;padding:20px 16px 16px;display:grid;gap:14px}
.hero .mosaic{position:absolute;right:-18px;top:-14px;width:min(62%,300px);height:auto;pointer-events:none}
.hero .eyebrow,.hero h1{position:relative;color:#fff}
.hero .eyebrow{opacity:.75}
.hero h1{max-width:62%}
.hero .byline{position:relative;margin:-8px 0 0;color:#fff;opacity:.9;font-size:13px;line-height:1.35;max-width:70%}
.hero .byline b{color:var(--taxi);font-weight:700}

  function mosaic() { // trencadís: seeded broken-tile polygons
    let seed = 11; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
    const cols = ["#E2442F", "#E39A0B", "#2952D1", "#0E9C88", "#6B4FD8", "#C13584", "#2E9B4F", "#F7C51E"];
    let out = "";
    for (let gx = 0; gx < 300; gx += 34) for (let gy = 0; gy < 230; gy += 32) {
      if (rnd() < 0.18 + (300 - gx) / 900) continue;
      const cx = gx + 17 + (rnd() - .5) * 6, cy = gy + 16 + (rnd() - .5) * 6, pts = [];
      const n = 4 + Math.floor(rnd() * 3);
      for (let a = 0; a < n; a++) { const ang = a / n * 6.283 + rnd() * .7, r = 11 + rnd() * 6; pts.push((cx + r * Math.cos(ang)).toFixed(1) + "," + (cy + r * Math.sin(ang)).toFixed(1)); }
      out += `<polygon points="${pts.join(" ")}" fill="${cols[Math.floor(rnd() * cols.length)]}"/>`;
    }
    return `<svg class="mosaic" viewBox="0 0 300 230" aria-hidden="true">${out}</svg>`;
  }

    const n = p.name.toLowerCase();
    for (const w of words) { if (n.includes(w)) s += 6; else if (hay.includes(w)) s += 2; }

        <div class="stat"><div class="k">Sunset</div><div class="v">≈${fmtHM(s.set)}</div><div class="s">tomorrow ≈${fmtHM(sTom.set)}</div></div>
        <div class="stat"><div class="k">Sea front</div><div class="v">Flat</div><div class="s">quietest at dawn</div></div></div>
      ${t.iso <= "2026-10-25" ? `<p class="small muted">Clocks go back on Sun 25 Oct, so sunrise jumps an hour earlier from that day.</p>` : ""}
      <div class="seg" role="tablist">${tabs.map(([k, l]) => `<button role="tab" data-act="${k}" aria-selected="${k === cur}">${l}</button>`).join("")}</div>${body}`;
    $$("#tab-active [data-act]").forEach((b) => b.addEventListener("click", () => { S.active = b.dataset.act; save(); renderActive(); }));
  }
  function routeCard(r, sport) {
    return `<article class="card"><div class="head"><div><span class="since">${esc(r.level)}</span><h3>${esc(r.name)}</h3></div><span class="tag">${r.sport === "both" ? "Run · Ride" : r.sport === "run" ? "Run" : "Ride"}</span></div>
      <div class="meta"><span><b>${esc(r.km)}</b></span><span>· ${esc(r.gain)}</span></div>
      <p class="order">${esc(r.what)}</p><p class="small muted">${esc(r.surface)}. ${esc(r.tip)}</p>
      <div class="meta">${lineChips(r.metro)}<span>Start: ${esc(r.startName)}</span></div>
      <div class="actions"><a class="btn taxi sm" href="${esc(routeLink(r, sport))}" target="_blank" rel="noopener">Open route</a><a class="btn ghost sm" href="${esc(toStart(r))}" target="_blank" rel="noopener">Get to the start</a></div></article>`;
  }
  function routeSheet(r) {
    if (!r) return;
    const sport = r.sport === "both" ? "run" : r.sport;
    openSheet(r.name, routeCard(r, sport) + (r.sport === "both" ? `<a class="btn ghost" href="${esc(routeLink(r, "ride"))}" target="_blank" rel="noopener">Open as a bike route</a>` : ""));
  }

  /* ---------------- MORE ---------------- */
  function renderMore() {
    const cur = S.more || "shop";
    const tabs = [["maps", "Mind maps"], ["shop", "Shops"], ["help", "Help"], ["rules", "Rules"], ["about", "About"]];
    let body = "";
    if (cur === "maps") {
      const m = MINDMAPS.find((x) => x.id === S.mm) || MINDMAPS[0];
      body = `<p class="small muted">One-page maps of everything in the app. Swipe sideways to read, or switch to fit-to-screen for the overview.</p>
        <div class="chips mmchips">${MINDMAPS.map((x) => `<button class="chip" data-mm="${x.id}" aria-pressed="${x.id === m.id}">${esc(x.title)}</button>`).join("")}</div>
        <div class="actions"><button class="btn ghost sm" id="fitBtn">${S.mmFit ? "Actual size" : "Fit to screen"}</button><span id="pdfSlot"></span><span class="small muted" id="pdfMsg"></span></div>
        <div class="mm${S.mmFit ? " fit" : ""}" id="mmBox">${m.svg}</div>
        <div class="card"><h3>Keep them offline</h3><p class="small">Save the PDF to your phone (Files, Books or Drive) and it opens with no signal. Installing the app version from GitHub also keeps every map and list on the phone.</p></div>`;
    } else if (cur === "shop") {
      body = `<div class="card"><h3>Everyday needs</h3><p class="small muted">Opens Google Maps with live hours for the nearest ones.</p>${needsRow()}
        <div class="actions"><a class="btn taxi sm" href="https://www.farmaguia.net" target="_blank" rel="noopener">${ic("cross")} On-duty pharmacy now</a><span class="small muted">Farmaguia, official pharmacists' finder</span></div></div>
        <div class="kicker"><h2>24-hour pharmacies</h2></div>
        <div class="list">${PLACES.filter((p) => p.kind === "pharmacy").map((p) => placeCard(p)).join("")}</div>
        <div class="card"><h3>Pharmacy tips</h3><ul class="plain small"><li>Look for the green cross. Most open about 09:00–21:00; some close for lunch.</li><li>Out of hours, the on-duty pharmacy is posted on every pharmacy door and on Farmaguia.</li><li>Many medicines need a prescription in Spain. Bring your own prescriptions and keep medicines in their original packs.</li><li>Emergency: 112.</li></ul></div>
        <div class="card"><h3>Supermarkets & convenience stores</h3><ul class="plain small">
        <li><b>Mercadona</b> · Mon–Sat 09:00–21:30 · closed Sundays & holidays</li>
        <li><b>Bonpreu</b> · Mon–Sat 09:00–21:00 · closed Sundays</li>
        <li><b>Condis</b> · many open every day, about 09:00–23:00</li>
        <li><b>Carrefour Express</b> · most open Sundays & holidays</li>
        <li><b>Supercor</b> (El Corte Inglés) · usually open Sundays & holidays, late</li>
        <li><b>Lidl, Aldi, Caprabo, Dia</b> · mostly closed Sundays & holidays</li></ul>
        <p class="small muted">Hours vary by branch. Check the store on Google Maps before you go.</p></div>
        <div class="note info"><b>Sundays</b><span>Until 29 Nov most shops close on Sundays. Maremagnum and La Roca Village open every day. Food markets close Sundays (Sant Antoni has a Sunday book market).</span></div>
        <div class="card"><h3>Tax-free shopping</h3><p class="small">If you live outside the EU, ask for a tax-free form when you pay and validate it at a DIVA kiosk at the airport before check-in to get the VAT back.</p></div>
        <div class="kicker"><h2>Tech, Apple & computers</h2></div><div class="list">${PLACES.filter((p) => p.kind === "tech").map((p) => placeCard(p)).join("")}</div>
        <p class="small muted">El Corte Inglés Plaça Catalunya also has a large electronics floor.</p>
        <div class="kicker"><h2>Designer fashion & bags</h2></div><p class="small muted">Passeig de Gràcia's "Golden Mile" holds the big international luxury houses; these are the standouts.</p>
        <div class="list">${PLACES.filter((p) => p.kind === "luxury").map((p) => placeCard(p)).join("")}</div>
        <div class="kicker"><h2>Shopping streets & malls</h2></div><div class="list">${PLACES.filter((p) => p.cat === "shop" && !["pharmacy", "tech", "luxury"].includes(p.kind)).map((p) => placeCard(p)).join("")}</div>`;
    } else if (cur === "help") {
      body = helpHTML();
    } else if (cur === "rules") {
      body = rulesHTML();
    } else {
      body = `<div class="card"><h2>About Rumbo</h2><p class="small">Built for the family's first visit to Barcelona. Data checked ${esc(DATA_VERSION)}: fares from TMB and AMB, hours from each venue's own site where published, fixtures from the league data feed. Hours marked "Check hours" were not published; confirm before going. The Must-see ranking, family places and the Viator tour list were added on 22 Oct 2026.</p>
        <p class="small muted">Directions open in Google Maps; ride buttons open Uber, Cabify, FREENOW or Bolt. Settings stay on this phone only.</p>
        <p class="small"><b>Install on your phone:</b> open the GitHub Pages version in Safari (iPhone: Share › Add to Home Screen) or Chrome (Android: ⋮ › Install app). It then opens full-screen and works offline.</p>
        <div class="actions"><button class="btn ghost sm" id="openSettings">Group settings</button></div></div>
        <div class="card"><h3>Founder</h3><p class="small"><b>Dr. Cary Marlowe T. Remotigue</b>, founder and creator of Rumbo Barcelona · SynthaSuite</p>
        <p class="small muted">© 2026 Cary Marlowe T. Remotigue. All rights reserved. App design, code, mind maps and written guide content may not be copied or republished without permission.</p></div>
        <div class="card"><h3>Official sources</h3><ul class="plain small">
        <li><a href="https://travel-europe.europa.eu/ees" target="_blank" rel="noopener">EU Entry/Exit System (EES)</a> · <a href="https://travel-europe.europa.eu/etias" target="_blank" rel="noopener">ETIAS</a></li>
        <li><a href="https://www.exteriores.gob.es/en/ServiciosAlCiudadano/Paginas/Visados.aspx" target="_blank" rel="noopener">Spain — visas (Ministry of Foreign Affairs)</a></li>
        <li><a href="https://atc.gencat.cat/en/tributs/ieet/" target="_blank" rel="noopener">Catalonia tourist tax (ATC)</a></li>
        <li><a href="https://taxi.amb.cat/en/usuaris/tarifes-del-taxi" target="_blank" rel="noopener">Official taxi fares (AMB)</a> · <a href="https://www.tmb.cat/en/barcelona-fares-metro-bus" target="_blank" rel="noopener">TMB fares</a></li>
        <li><a href="https://www.barcelonaturisme.com/wv3/en/" target="_blank" rel="noopener">Barcelona Turisme</a> · <a href="https://www.spain.info/en/" target="_blank" rel="noopener">spain.info</a></li></ul></div>`;
    }
    $("#tab-more").innerHTML = `<div><p class="eyebrow">Shops, help, rules & settings</p><h1>Good to know</h1></div>
      <div class="seg" role="tablist">${tabs.map(([k, l]) => `<button role="tab" data-more="${k}" aria-selected="${k === cur}">${l}</button>`).join("")}</div>${body}`;
    $$("#tab-more [data-more]").forEach((b) => b.addEventListener("click", () => { S.more = b.dataset.more; save(); renderMore(); }));
    $$("#tab-more [data-mm]").forEach((b) => b.addEventListener("click", () => { S.mm = b.dataset.mm; save(); renderMore(); }));
    const fb = $("#fitBtn"); if (fb) fb.addEventListener("click", () => { S.mmFit = !S.mmFit; save(); renderMore(); });
    if (cur === "maps") pdfSlot();
    const os = $("#openSettings"); if (os) os.addEventListener("click", settingsSheet);
  }
  let dl = undefined;
  async function pdfSlot() {
    const slot = $("#pdfSlot"); if (!slot) return;
    const inClaude = !!(window.claude && window.claude.use);
    if (!inClaude) { slot.innerHTML = `<a class="btn taxi sm" href="rumbo-mindmaps.pdf" target="_blank" rel="noopener">${ic("download")} Open PDF</a>`; return; }
    if (dl === undefined) { try { dl = await window.claude.use("downloads"); } catch (e) { dl = null; } }
    if (!$("#pdfSlot")) return;
    if (!dl) { $("#pdfSlot").innerHTML = ""; $("#pdfMsg").textContent = "Saving files isn't available in this view."; return; }
    $("#pdfSlot").innerHTML = `<button class="btn taxi sm" id="savePdf">${ic("download")} Save PDF for offline</button>`;
    $("#savePdf").addEventListener("click", async () => {
      const b = $("#savePdf"), msg = $("#pdfMsg"); b.disabled = true; msg.textContent = "Preparing…";
      try {
        const r = await fetch("rumbo-mindmaps.pdf"); if (!r.ok) throw { code: "fetch" };
        await dl.save({ filename: "Rumbo-Barcelona-mind-maps.pdf", data: await r.blob() });
        msg.textContent = "Saved. Open it from your files any time, even offline.";
      } catch (e) {
        msg.textContent = e && e.code === "declined" ? "Not saved." : e && e.code === "rate_limited" ? "A save prompt is already open." : "Couldn't save just now; try again in a moment.";
      } finally { b.disabled = false; }
    });
  }
  function rulesHTML() {
    return `
    <div class="card"><h2>Entering & staying</h2><ul class="plain small">
      <li><b>EES is live:</b> since 10 Apr 2026, non-EU visitors are fingerprinted and photographed at the Schengen border instead of passport stamps. Short stays are up to 90 days in any 180.</li>
      <li><b>ETIAS is not running yet.</b> No application is needed now; the EU will announce a start date months ahead. Only use europa.eu sites.</li>
      <li><b>Carry your passport</b> (or national ID for EU citizens). Police can ask for it; keep a photo of it too.</li>
      <li>Hotels must register guests' ID details under Spanish law; that's why check-in asks for more information than elsewhere.</li></ul></div>
    <div class="card"><h2>Tourist tax</h2><p class="small">Barcelona doubled the tax on 1 Apr 2026. Per adult per night: <b>€12</b> 5-star · <b>€8.40</b> 4-star · <b>€9.50</b> tourist flat · <b>€7</b> other hotels · <b>€6</b> youth hostel, plus 10% VAT. Charged for the first 7 nights only. Children 16 and under pay nothing. Usually paid at check-out.</p></div>
    <div class="card"><h2>Street rules (fines apply)</h2><ul class="plain small">
      <li>No drinking alcohol in streets, squares, parks or on the beach; drink at bars and terraces.</li>
      <li>Swimwear and bare chests stay on the beach (€120–300 fines in town).</li>
      <li>Don't buy from street sellers of fake brands; buyers can be fined too.</li>
      <li>Quiet hours 23:00–07:00 in flats and on terraces. Beaches are smoke-free.</li>
      <li>Smoking on bar terraces is still allowed: the national ban lapsed when parliament was dissolved for the 29 Nov election.</li></ul></div>
    <div class="card"><h2>Safety</h2><ul class="plain small">
      <li>Pickpockets work La Rambla, the metro (L3, L1), Sagrada Família and the beach. Phone in a front pocket, bag zipped and in front, nothing on café tables.</li>
      <li>Emergencies: <span class="copy">112</span> (any service, English spoken). City police: <span class="copy">092</span>. Report thefts to the Mossos d'Esquadra.</li>
      <li>Pharmacies show a green cross. Out of hours, the duty pharmacy (farmàcia de guàrdia) is listed on every pharmacy's door.</li></ul></div>
    <div class="card"><h2>Local rhythm</h2><ul class="plain small">
      <li>Lunch 13:30–16:00, dinner from 20:30. Kitchens often close 16:00–20:00.</li>
      <li>Tipping is optional: round up, or 5–10% for good table service.</li>
      <li>Catalan and Spanish are both official; "Bon dia" and "Gràcies" go a long way.</li>
      <li>1 Nov is All Saints; 29 Nov is the general election and the first Sunday shops may open.</li></ul></div>`;
  }

  /* ---------------- boot ---------------- */
  renderHeader();
  setInterval(() => { renderHeader(); }, 30000);
  const hash = (location.hash || "").replace("#", "");
  setTab(TABS.includes(hash) ? hash : S.tab || "ask", true);
})();

</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script></body></html>
